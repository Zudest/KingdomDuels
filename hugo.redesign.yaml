# ---------------------------------------------------------------------------
# OVERLAY DE PREVIEW — theme Solitude
#
# NO reemplaza a hugo.toml: se aplica ENCIMA de él. Se usa así:
#   hugo server --config hugo.toml,hugo.redesign.yaml
# (o simplemente: ./preview.ps1)
#
# hugo.toml sigue siendo la config de producción con hugo-theme-stack.
# ---------------------------------------------------------------------------

theme: solitude

# Solitude tiene la seccion "posts" hardcodeada en ~15 plantillas, pero
# nuestro contenido vive en content/post/. En vez de renombrar la carpeta
# (que rompe URLs y ensucia el diff), la MONTAMOS como "posts". Nada cambia
# en disco; es puro remapeo virtual y desaparece al quitar este overlay.
module:
  mounts:
    - source: content
      target: content
      # (excludeFiles esta deprecado en Hugo 0.153+, pero el reemplazo 'files'
      #  no excluye directorios correctamente aca. Warning inofensivo.)
      excludeFiles:
        - post/**
    - source: content/post
      target: content/posts

# ...y devolvemos las URLs exactas a /post/<nombre-de-archivo>/ para no romper
# ningun enlace existente (:contentbasename = nombre del .md, igual que hoy).
permalinks:
  posts: /post/:contentbasename/

# Solitude necesita estos formatos de salida (search.xml y links.json).
outputs:
  home: [HTML, RSS, Search, Links]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

# Solitude usa FontAwesome para los iconos del menú; los de hugo.toml son
# nombres de Tabler (propios de Stack) y no renderizarían.
menus:
  main:
    - name: About
      pageRef: /about
      weight: 10
      params: { icon: fas fa-circle-question }
    - name: Rules
      pageRef: /rules
      weight: 20
      params: { icon: fas fa-book }
    - name: Yugioh Scrolls
      pageRef: /yugioh-scrolls
      weight: 30
      params: { icon: fas fa-scroll }
    - name: Card Library
      url: /cards/
      weight: 40
      params: { icon: fas fa-layer-group }
    - name: Restricted List
      pageRef: /restricted-list
      weight: 50
      params: { icon: fas fa-ban }
    - name: Releases
      pageRef: /releases
      weight: 60
      params: { icon: fas fa-box-open }

params:
  author:
    name: Kingdom Duels
  description: A fan-made Yu-Gi-Oh! card game inspired by the original manga and anime.

  solitude:
    site:
      name:
        class: text
        custom: Kingdom Duels
      icon: /img/avatar.png

    # --- Bloque hero de la home (el banner grande + lista de la derecha) ---
    hometop:
      enable: true
      banner:
        title: Kingdom Duels
        desc: A fan-made Yu-Gi-Oh! card game inspired by the original manga and anime.
      recommendList: []

    # --- Columna derecha (aside) ---
    aside:
      my_card:
        author:
          img: /img/avatar.png
        description: Kingdom Duels
        content: A fan-made Yu-Gi-Oh! card game.
      siteinfo:
        runtime: 2014-01-01 00:00:00

    footer:
      information:
        author: /img/avatar.png

    search:
      enable: true
      type: local

    # Apagamos lo que depende de servicios externos (comentarios, música, PWA)
    comment:
      use: ""
    console:
      enable: false
